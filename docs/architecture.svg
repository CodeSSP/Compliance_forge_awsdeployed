<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="920" viewBox="0 0 1360 920" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6472"/>
    </marker>
    <marker id="am" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6933ff"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff6b35"/>
    </marker>
  </defs>

  <rect width="1360" height="920" fill="#fbfbfd"/>

  <text x="40" y="46" font-size="25" font-weight="700" fill="#12141a">ComplianceForge — Agentic AML Compliance</text>
  <text x="40" y="72" font-size="15" fill="#5b6472">CockroachDB as the agent memory layer · deployed on AWS · RBI / FIU-IND / FEMA / NPCI</text>

  <!-- legend -->
  <g font-size="12.5">
    <rect x="960" y="30" width="14" height="14" rx="3" fill="#6933ff"/>
    <text x="982" y="42" fill="#3b4350">CockroachDB</text>
    <rect x="1090" y="30" width="14" height="14" rx="3" fill="#ff9900"/>
    <text x="1112" y="42" fill="#3b4350">AWS</text>
    <rect x="1170" y="30" width="14" height="14" rx="3" fill="#2e7d5b"/>
    <text x="1192" y="42" fill="#3b4350">Agent layers</text>
  </g>

  <!-- ============ CLIENT / AGENT TOOLING ============ -->
  <rect x="40" y="98" width="600" height="96" rx="10" fill="#fff" stroke="#d9dde4"/>
  <text x="58" y="124" font-size="14" font-weight="700" fill="#12141a">Interfaces &amp; Agent Tooling</text>

  <rect x="58" y="136" width="150" height="42" rx="7" fill="#eef1f6" stroke="#c8cfda"/>
  <text x="133" y="153" font-size="12.5" text-anchor="middle" fill="#12141a" font-weight="600">React + Vite UI</text>
  <text x="133" y="169" font-size="11" text-anchor="middle" fill="#5b6472">SSE pipeline view</text>

  <rect x="218" y="136" width="196" height="42" rx="7" fill="#f0eaff" stroke="#b9a3ff"/>
  <text x="316" y="153" font-size="12.5" text-anchor="middle" fill="#3d1a99" font-weight="600">Managed MCP Server</text>
  <text x="316" y="169" font-size="11" text-anchor="middle" fill="#6933ff">Claude Code → live schema</text>

  <rect x="424" y="136" width="198" height="42" rx="7" fill="#f0eaff" stroke="#b9a3ff"/>
  <text x="523" y="153" font-size="12.5" text-anchor="middle" fill="#3d1a99" font-weight="600">ccloud CLI (agent-ready)</text>
  <text x="523" y="169" font-size="11" text-anchor="middle" fill="#6933ff">provision · backup · audit</text>

  <!-- ============ PIPELINE L0-L7 ============ -->
  <rect x="40" y="216" width="600" height="620" rx="10" fill="#fff" stroke="#d9dde4"/>
  <text x="58" y="242" font-size="14" font-weight="700" fill="#12141a">Agent Pipeline — ECS Fargate (FastAPI)</text>

  <g>
    <rect x="58" y="256" width="564" height="52" rx="7" fill="#eaf5ef" stroke="#8fc4aa"/>
    <text x="72" y="277" font-size="13" font-weight="700" fill="#1d5c42">L0 · Event Ingestion</text>
    <text x="72" y="295" font-size="11.5" fill="#3b4350">Publishes transactions to SQS · consumes and normalises</text>

    <rect x="58" y="316" width="564" height="60" rx="7" fill="#eaf5ef" stroke="#8fc4aa"/>
    <text x="72" y="337" font-size="13" font-weight="700" fill="#1d5c42">L1 · Orchestrator — MEMORY READ</text>
    <text x="72" y="355" font-size="11.5" fill="#3b4350">MinHash/LSH over case_memory → short-circuit if a near-identical</text>
    <text x="72" y="370" font-size="11.5" fill="#3b4350">case was already decided AND the regulation hash is unchanged</text>

    <rect x="58" y="384" width="564" height="60" rx="7" fill="#eaf5ef" stroke="#8fc4aa"/>
    <text x="72" y="405" font-size="13" font-weight="700" fill="#1d5c42">L2 · Transaction Monitor</text>
    <text x="72" y="423" font-size="11.5" fill="#3b4350">Six parallel detectors C1–C6 (velocity, sanctions, graph flow,</text>
    <text x="72" y="438" font-size="11.5" fill="#3b4350">dormancy, FEMA/LRS, geo) → weighted suspicion score</text>

    <rect x="58" y="452" width="564" height="60" rx="7" fill="#eaf5ef" stroke="#8fc4aa"/>
    <text x="72" y="473" font-size="13" font-weight="700" fill="#1d5c42">L3 · Regulation Interpreter — VECTOR RETRIEVAL</text>
    <text x="72" y="491" font-size="11.5" fill="#3b4350">Dual arm: BM25 keyword + distributed VECTOR INDEX (768-dim)</text>
    <text x="72" y="506" font-size="11.5" fill="#3b4350">→ 4 sub-scores, confidence band, citation trail</text>

    <rect x="58" y="520" width="564" height="52" rx="7" fill="#eaf5ef" stroke="#8fc4aa"/>
    <text x="72" y="541" font-size="13" font-weight="700" fill="#1d5c42">L4 · Report Generator</text>
    <text x="72" y="559" font-size="11.5" fill="#3b4350">goAML STR XML + XSD self-healing repair loop → review PDF</text>

    <rect x="58" y="580" width="564" height="52" rx="7" fill="#eaf5ef" stroke="#8fc4aa"/>
    <text x="72" y="601" font-size="13" font-weight="700" fill="#1d5c42">L5 · Maker–Checker Queue</text>
    <text x="72" y="619" font-size="11.5" fill="#3b4350">SELECT … FOR UPDATE — serializable claim, no double-assignment</text>

    <rect x="58" y="640" width="564" height="60" rx="7" fill="#eaf5ef" stroke="#8fc4aa"/>
    <text x="72" y="661" font-size="13" font-weight="700" fill="#1d5c42">L6 · Audit Logger — MEMORY INTEGRITY</text>
    <text x="72" y="679" font-size="11.5" fill="#3b4350">SHA-256 hash chain, sharded per region, periodically anchored.</text>
    <text x="72" y="694" font-size="11.5" fill="#3b4350">Serializable isolation is what stops concurrent appends forking it.</text>

    <rect x="58" y="708" width="564" height="60" rx="7" fill="#eaf5ef" stroke="#8fc4aa"/>
    <text x="72" y="729" font-size="13" font-weight="700" fill="#1d5c42">L7 · Regulatory Watch — MEMORY INVALIDATION</text>
    <text x="72" y="747" font-size="11.5" fill="#3b4350">Scrapes RBI, re-embeds changed circulars, updates regulation hash</text>
    <text x="72" y="762" font-size="11.5" fill="#3b4350">→ marks dependent cached verdicts stale so L1 cannot reuse them</text>
  </g>

  <text x="58" y="796" font-size="11.5" fill="#5b6472">Model gateway: Amazon Bedrock / SageMaker (Phi-4-mini) · Ollama for offline dev</text>
  <text x="58" y="816" font-size="11.5" fill="#5b6472">Every read–modify–write wrapped in a 40001 serialization retry</text>

  <!-- ============ COCKROACHDB MEMORY LAYER ============ -->
  <rect x="690" y="98" width="380" height="600" rx="10" fill="#faf7ff" stroke="#6933ff" stroke-width="2"/>
  <text x="710" y="126" font-size="15" font-weight="700" fill="#3d1a99">CockroachDB — Agent Memory Layer</text>
  <text x="710" y="146" font-size="11.5" fill="#6933ff">AWS ap-south-1 / ap-south-2 · SERIALIZABLE</text>

  <g font-size="11.5">
    <rect x="710" y="160" width="340" height="46" rx="6" fill="#fff" stroke="#c9b6ff"/>
    <text x="724" y="178" font-weight="700" fill="#12141a">case_memory</text>
    <text x="724" y="195" fill="#5b6472">MinHash feature sets · verdicts · stale flag</text>

    <rect x="710" y="214" width="340" height="60" rx="6" fill="#fff" stroke="#c9b6ff"/>
    <text x="724" y="232" font-weight="700" fill="#12141a">regulatory_chunks</text>
    <text x="724" y="249" fill="#5b6472">VECTOR(768) + VECTOR INDEX (C-SPANN)</text>
    <text x="724" y="265" fill="#5b6472">1,445 chunks · row + embedding + index commit atomically</text>

    <rect x="710" y="282" width="340" height="46" rx="6" fill="#fff" stroke="#c9b6ff"/>
    <text x="724" y="300" font-weight="700" fill="#12141a">audit_chain / audit_anchors</text>
    <text x="724" y="317" fill="#5b6472">Sharded hash chain · tamper-evident</text>

    <rect x="710" y="336" width="340" height="46" rx="6" fill="#fff" stroke="#c9b6ff"/>
    <text x="724" y="354" font-weight="700" fill="#12141a">verdicts / review_queue</text>
    <text x="724" y="371" fill="#5b6472">Task state · FIU-IND 7-day deadline</text>

    <rect x="710" y="390" width="340" height="46" rx="6" fill="#fff" stroke="#c9b6ff"/>
    <text x="724" y="408" font-weight="700" fill="#12141a">transactions / case_history / watchlist</text>
    <text x="724" y="425" fill="#5b6472">Structured transactional context for C1–C6</text>

    <rect x="710" y="444" width="340" height="46" rx="6" fill="#fff" stroke="#c9b6ff"/>
    <text x="724" y="462" font-weight="700" fill="#12141a">regulation_meta / watch_state</text>
    <text x="724" y="479" fill="#5b6472">Composite hash · L7 cursor</text>
  </g>

  <rect x="710" y="504" width="340" height="80" rx="7" fill="#f0eaff" stroke="#b9a3ff"/>
  <text x="724" y="524" font-size="12.5" font-weight="700" fill="#3d1a99">REGIONAL BY ROW + SURVIVE REGION FAILURE</text>
  <text x="724" y="543" font-size="11.5" fill="#3b4350">RBI data localisation enforced by the schema,</text>
  <text x="724" y="559" font-size="11.5" fill="#3b4350">not by a deployment document. Indian rows</text>
  <text x="724" y="575" font-size="11.5" fill="#3b4350">physically cannot leave India.</text>

  <rect x="710" y="596" width="340" height="82" rx="7" fill="#f0eaff" stroke="#b9a3ff"/>
  <text x="724" y="616" font-size="12.5" font-weight="700" fill="#3d1a99">AS OF SYSTEM TIME — regulator replay</text>
  <text x="724" y="635" font-size="11.5" fill="#3b4350">Reconstructs exactly what the agent believed</text>
  <text x="724" y="651" font-size="11.5" fill="#3b4350">at any past instant; the hash chain proves</text>
  <text x="724" y="667" font-size="11.5" fill="#3b4350">nothing was altered since.</text>

  <!-- ============ AWS SERVICES ============ -->
  <rect x="1100" y="98" width="220" height="600" rx="10" fill="#fff9f0" stroke="#ff9900" stroke-width="2"/>
  <text x="1118" y="126" font-size="15" font-weight="700" fill="#8a4b00">AWS</text>

  <g font-size="11.5">
    <rect x="1118" y="142" width="184" height="42" rx="6" fill="#fff" stroke="#ffcc80"/>
    <text x="1130" y="160" font-weight="700" fill="#12141a">ECS Fargate</text>
    <text x="1130" y="176" fill="#5b6472">FastAPI backend</text>

    <rect x="1118" y="192" width="184" height="42" rx="6" fill="#fff" stroke="#ffcc80"/>
    <text x="1130" y="210" font-weight="700" fill="#12141a">Amazon SQS</text>
    <text x="1130" y="226" fill="#5b6472">L0 transport + DLQ</text>

    <rect x="1118" y="242" width="184" height="42" rx="6" fill="#fff" stroke="#ffcc80"/>
    <text x="1130" y="260" font-weight="700" fill="#12141a">Amazon S3 + KMS</text>
    <text x="1130" y="276" fill="#5b6472">circulars · STR PDFs · XML</text>

    <rect x="1118" y="292" width="184" height="42" rx="6" fill="#fff" stroke="#ffcc80"/>
    <text x="1130" y="310" font-weight="700" fill="#12141a">Bedrock / SageMaker</text>
    <text x="1130" y="326" fill="#5b6472">Phi-4-mini reasoning</text>

    <rect x="1118" y="342" width="184" height="42" rx="6" fill="#fff" stroke="#ffcc80"/>
    <text x="1130" y="360" font-weight="700" fill="#12141a">Lambda + EventBridge</text>
    <text x="1130" y="376" fill="#5b6472">L7 watch · L6 anchor</text>

    <rect x="1118" y="392" width="184" height="42" rx="6" fill="#fff" stroke="#ffcc80"/>
    <text x="1130" y="410" font-weight="700" fill="#12141a">Amazon Textract</text>
    <text x="1130" y="426" fill="#5b6472">scanned circular OCR</text>

    <rect x="1118" y="442" width="184" height="42" rx="6" fill="#fff" stroke="#ffcc80"/>
    <text x="1130" y="460" font-weight="700" fill="#12141a">Secrets Manager</text>
    <text x="1130" y="476" fill="#5b6472">CRDB DSN</text>

    <rect x="1118" y="492" width="184" height="42" rx="6" fill="#fff" stroke="#ffcc80"/>
    <text x="1130" y="510" font-weight="700" fill="#12141a">CloudWatch</text>
    <text x="1130" y="526" fill="#5b6472">logs · Container Insights</text>
  </g>

  <!-- ============ MEMORY LOOP ============ -->
  <rect x="690" y="712" width="630" height="124" rx="10" fill="#fff" stroke="#d9dde4"/>
  <text x="710" y="738" font-size="14" font-weight="700" fill="#12141a">The memory loop</text>
  <text x="710" y="762" font-size="12" fill="#3b4350">
    <tspan font-weight="700" fill="#3d1a99">Store</tspan> — every decided case writes its MinHash feature set, verdict and regulation hash
  </text>
  <text x="710" y="783" font-size="12" fill="#3b4350">
    <tspan font-weight="700" fill="#3d1a99">Retrieve</tspan> — L1 matches new transactions against that memory; L3 pulls statute by vector similarity
  </text>
  <text x="710" y="804" font-size="12" fill="#3b4350">
    <tspan font-weight="700" fill="#3d1a99">Act</tspan> — a hit short-circuits L2/L3 entirely; a miss runs the full pipeline and writes new memory
  </text>
  <text x="710" y="825" font-size="12" fill="#3b4350">
    <tspan font-weight="700" fill="#3d1a99">Invalidate</tspan> — L7 changes the regulation hash, marking dependent memory stale. Memory expires when the law does.
  </text>

  <!-- arrows -->
  <line x1="640" y1="346" x2="690" y2="200" stroke="#6933ff" stroke-width="2" marker-end="url(#am)"/>
  <line x1="640" y1="482" x2="690" y2="250" stroke="#6933ff" stroke-width="2" marker-end="url(#am)"/>
  <line x1="640" y1="670" x2="690" y2="305" stroke="#6933ff" stroke-width="2" marker-end="url(#am)"/>
  <line x1="640" y1="738" x2="690" y2="460" stroke="#6933ff" stroke-width="2" marker-end="url(#am)"/>
  <line x1="640" y1="282" x2="1118" y2="213" stroke="#ff6b35" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ao)"/>
  <line x1="640" y1="550" x2="1118" y2="263" stroke="#ff6b35" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ao)"/>
  <line x1="316" y1="178" x2="700" y2="150" stroke="#6933ff" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#am)"/>
  <line x1="523" y1="178" x2="700" y2="160" stroke="#6933ff" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#am)"/>
</svg>
